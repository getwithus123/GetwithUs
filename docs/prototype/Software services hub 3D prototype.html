<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Software services hub 3D prototype</title>
<style>
:root{--bg:#eef3f6;--ink:#0f1b2d;--line:#cfdbe3;--g1:#f4f8fa;--g2:#d3e3ea;--dot:#cfdbe3;--teal:#0f5f66;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b121a;--ink:#e8eef4;--line:#25323f;--g1:#1b2a3a;--g2:#0f1823;--dot:#25323f;--teal:#2fb5bf}}
:root[data-theme="dark"]{--bg:#0b121a;--ink:#e8eef4;--line:#25323f;--g1:#1b2a3a;--g2:#0f1823;--dot:#25323f;--teal:#2fb5bf}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;box-sizing:border-box}
#panel{position:relative;width:min(100%,760px);aspect-ratio:4/3;border-radius:28px;border:1px solid var(--line);background:radial-gradient(circle at 30% 20%,var(--g1),var(--g2));overflow:hidden}
#panel::before{content:"";position:absolute;inset:0;background:radial-gradient(var(--dot) 1px,transparent 1px) 0 0/22px 22px;opacity:.7}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ctl{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center}
button{font:inherit;color:#fff;background:var(--teal);border:0;border-radius:999px;padding:9px 18px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
input[type=range]{accent-color:var(--teal);width:180px}
</style></head><body>
<div id="panel" role="img" aria-label="Five lines of work, web, app, automation, marketing and cloud, connected to one shared way of working"></div>
<div class="ctl">
  <label>Explode <input id="k" type="range" min="0" max="1" step="0.01" value="0.5"></label>
  <button id="run" type="button">Replay</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const PAL={light:{teal:'#0f5f66',ink:'#0f1b2d',white:'#ffffff',soft:'#b7c0c9',tint:'#8fc3cb',pure:'#ffffff'},
dark:{teal:'#2fb5bf',ink:'#e8eef4',white:'#dfe8ef',soft:'#9aa8b6',tint:'#3a6a72',pure:'#ffffff'}};
const mq=matchMedia('(prefers-color-scheme: dark)'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const dark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':mq.matches};
const panel=document.getElementById('panel'),slider=document.getElementById('k');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
panel.appendChild(renderer.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(30,4/3,.1,100);cam.position.set(0,0,10);
scene.add(new THREE.HemisphereLight(0xffffff,0x9fb8c2,.6));
const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(-3,4,8);dl.castShadow=true;
Object.assign(dl.shadow.camera,{left:-5,right:5,top:5,bottom:-5,near:1,far:25});
dl.shadow.mapSize.set(1024,1024);dl.shadow.bias=-.0006;dl.shadow.normalBias=.02;dl.shadow.radius=4;scene.add(dl);
const pl=new THREE.PointLight(0x0f5f66,.5,12);pl.position.set(-3,-2,4);scene.add(pl);
const root=new THREE.Group();root.rotation.set(-.1,-.3,0);scene.add(root);

const mats=[],gc={};let drawn=false;
function rg(w,h,r,d){const key=[w,h,r,d]+'';if(gc[key])return gc[key];r=Math.min(r,w/2,h/2);
const x=-w/2,y=-h/2,s=new THREE.Shape();s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);
s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);
s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);
const g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelThickness:.012,bevelSize:.012,bevelSegments:2,curveSegments:8});
g.translate(0,0,-d/2);return gc[key]=g}
function mat(k,e=0,o=1){const m=new THREE.MeshStandardMaterial({color:PAL.light[k],roughness:.5,metalness:0,transparent:o<1,opacity:o});
if(e){m.emissive=new THREE.Color(PAL.light.teal);m.emissiveIntensity=e}m.userData={k,e};mats.push(m);return m}
function rr(p,w,h,r,d,k,x,y,z,e,o,rz,cast=true){const m=new THREE.Mesh(rg(w,h,r,d),mat(k,e,o));
m.position.set(x,y,z);if(rz)m.rotation.z=rz;m.castShadow=cast;m.receiveShadow=true;p.add(m);return m}
function theme(){const p=dark()?PAL.dark:PAL.light;mats.forEach(m=>{m.color.set(p[m.userData.k]);if(m.userData.e)m.emissive.set(p.teal)});pl.color.set(p.teal);drawn=false}

rr(root,6,3.9,.3,.06,'tint',0,.05,-.5,0,.5,0,false);

const nodes=[];
function node(x,y,za,ze,arr,build){const g=new THREE.Group();g.position.set(x,y,za);root.add(g);build(g);nodes.push({g,x,y,za,ze,arr})}
// hub: the one way of working
node(0,.05,.1,.6,0,g=>{rr(g,1.1,1.1,.28,.12,'teal',0,0,0,.15);rr(g,.5,.5,.25,.04,'pure',0,0,.08);rr(g,.26,.26,.13,.04,'teal',0,0,.1,.15);rr(g,.24,.1,.03,.04,'pure',.12,0,.1)});
// five lines of work, order = pulse order
const TILES=[
 g=>{rr(g,.65,.12,.05,.04,'teal',0,.27,.05);rr(g,.65,.32,.06,.04,'tint',0,-.03,.05);rr(g,.4,.06,.03,.03,'soft',-.12,-.28,.05)},          // web
 g=>{rr(g,.38,.66,.1,.06,'teal',0,0,.05,.15);rr(g,.14,.04,.02,.03,'pure',0,.25,.1);rr(g,.2,.2,.06,.03,'pure',0,-.02,.1)},                 // app
 g=>{rr(g,.2,.2,.1,.04,'teal',-.25,0,.05);rr(g,.2,.2,.1,.04,'tint',.25,.2,.05);rr(g,.2,.2,.1,.04,'tint',.25,-.2,.05);
     rr(g,.34,.04,.02,.03,'soft',0,.11,.05,0,.5);rr(g,.34,.04,.02,.03,'soft',0,-.11,.05,0,-.5)},                                       // automation
 g=>{[.2,.35,.28,.5].forEach((h,i)=>rr(g,.12,h,.04,.04,i<3?'tint':'teal',-.27+i*.18,-.3+h/2,.05))},                                       // marketing
 g=>{rr(g,.55,.22,.11,.1,'teal',0,-.08,.05,.15);rr(g,.3,.3,.15,.1,'teal',-.1,.08,.055,.15);rr(g,.36,.36,.18,.1,'teal',.08,.12,.06,.15)}   // cloud
];
const HUB=new THREE.Vector2(0,.05),TP=[],WIN=[];
TILES.forEach((build,i)=>{const a=Math.PI/2+i*Math.PI*2/5,x=2.2*Math.cos(a),y=.05+1.3*Math.sin(a);TP.push([x,y]);
WIN.push([i*.8,.7]);node(x,y,.1,.9+(i%2)*.4,i*.8+.7,g=>{rr(g,.9,.9,.2,.1,'white',0,0,0);build(g)})});

const pulses=[],curves=[];
TP.forEach(([x,y])=>{const d=new THREE.Vector2(x-HUB.x,y-HUB.y).normalize(),p0=new THREE.Vector3(HUB.x+d.x*.65,HUB.y+d.y*.65,-.3),
p1=new THREE.Vector3(x-d.x*.55,y-d.y*.55,-.3),t=new THREE.Vector3(d.x*.4,d.y*.4,0);
const c=new THREE.CubicBezierCurve3(p0,p0.clone().add(t),p1.clone().sub(t),p1);curves.push(c);
const tb=new THREE.Mesh(new THREE.TubeGeometry(c,32,.028,8,false),mat('soft'));tb.receiveShadow=true;root.add(tb);
const s=new THREE.Mesh(new THREE.SphereGeometry(.075,16,12),mat('teal',.9));s.visible=false;root.add(s);pulses.push(s)});
const LOOP=5.6;

function size(){const w=panel.clientWidth,h=panel.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();drawn=false}
new ResizeObserver(size).observe(panel);
let mx=0,my=0,vis=true,last=0,run0=performance.now(),firstSeen=false;
addEventListener('pointermove',e=>{mx=(e.clientX/innerWidth-.5)*2;my=(e.clientY/innerHeight-.5)*2},{passive:true});
slider.addEventListener('input',()=>drawn=false);
document.getElementById('run').onclick=()=>run0=performance.now();
new IntersectionObserver(([e])=>{vis=e.isIntersecting;if(vis&&!firstSeen){firstSeen=true;run0=performance.now()}}).observe(panel);
mq.addEventListener('change',theme);theme();size();

const smooth=x=>x*x*(3-2*x);
function frame(now){requestAnimationFrame(frame);if(!vis||now-last<33)return;last=now;
if(reduce&&drawn)return;
const k=reduce?.3:+slider.value;let t=reduce?-1:(now-run0)/1000;if(t>LOOP){run0=now;t=0}
if(!reduce){root.rotation.y+=(-.3+mx*.28-root.rotation.y)*.08;root.rotation.x+=(-.1+my*.16-root.rotation.x)*.08}
nodes.forEach((n,i)=>{n.g.position.z=n.za+(n.ze-n.za)*k;n.g.position.y=n.y+(reduce?0:Math.sin(now/900+i*.9)*.025*k);
const dt=t-n.arr;n.g.scale.setScalar(t>=0&&dt>=0&&dt<=.45?1+.12*(1-dt/.45):1)});
pulses.forEach((s,i)=>{const p=(t-WIN[i][0])/WIN[i][1];s.visible=t>=0&&p>=0&&p<=1;if(s.visible)s.position.copy(curves[i].getPoint(smooth(p)))});
renderer.render(scene,cam);drawn=true}
requestAnimationFrame(frame);
</script></body></html>
