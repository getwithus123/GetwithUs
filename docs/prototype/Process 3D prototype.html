<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Process 3D prototype</title>
<style>
:root{--bg:#eef3f6;--tx:#0f1b2d;--p1:#f4f8fa;--p2:#d3e3ea;--dot:#cfdbe3;--bd:#cfdbe3;--ac:#0f5f66;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b121a;--tx:#e8eef4;--p1:#1b2a3a;--p2:#0f1823;--dot:#25323f;--bd:#25323f;--ac:#2fb5bf}}
:root[data-theme=dark]{--bg:#0b121a;--tx:#e8eef4;--p1:#1b2a3a;--p2:#0f1823;--dot:#25323f;--bd:#25323f;--ac:#2fb5bf}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px}
.panel{position:relative;aspect-ratio:4/3;border-radius:28px;border:1px solid var(--bd);overflow:hidden;background:radial-gradient(circle at 30% 20%,var(--p1),var(--p2))}
.panel::before{content:"";position:absolute;inset:0;background:radial-gradient(var(--dot) 1px,transparent 1px) 0 0/22px 22px;opacity:.7}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px;font-size:14px}
button{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:999px;padding:8px 16px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
input[type=range]{accent-color:var(--ac);width:160px}
</style></head><body>
<div class="wrap">
<div class="panel" id="panel"><canvas id="c"></canvas></div>
<div class="bar">
<button class="p" id="replay">Replay process</button>
<label>Explode <input type="range" id="k" min="0" max="1" step=".01" value=".5"></label>
<button id="theme">Toggle theme</button>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const LT={teal:'#0f5f66',ink:'#0f1b2d',surf:'#ffffff',soft:'#b7c0c9',tint:'#8fc3cb',white:'#ffffff'};
const DK={teal:'#2fb5bf',ink:'#0f1b2d',surf:'#dfe8ef',soft:'#9aa8b6',tint:'#3a6a72',white:'#ffffff'};
const root=document.documentElement;
const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
let C=isDark()?DK:LT;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const panel=document.getElementById('panel'),cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(30,4/3,.1,50);cam.position.set(0,0,10);
scene.add(new THREE.HemisphereLight(0xffffff,0x9fb8c2,.6));
const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(-3,4,8);dl.castShadow=true;
dl.shadow.mapSize.set(1024,1024);Object.assign(dl.shadow.camera,{left:-5,right:5,top:5,bottom:-5,near:1,far:25});
dl.shadow.bias=-.0006;dl.shadow.normalBias=.02;dl.shadow.radius=4;scene.add(dl);
const pl=new THREE.PointLight(C.teal,.5,12);pl.position.set(-3,-2,4);scene.add(pl);
const rootG=new THREE.Group();rootG.rotation.set(-.1,-.28,0);scene.add(rootG);

const mats=[],labels=[];
function rg(w,h,r,d){r=Math.min(r,w/2,h/2);const s=new THREE.Shape(),x=-w/2,y=-h/2,P=Math.PI;
s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.absarc(x+w-r,y+r,r,-P/2,0);s.lineTo(x+w,y+h-r);s.absarc(x+w-r,y+h-r,r,0,P/2);
s.lineTo(x+r,y+h);s.absarc(x+r,y+h-r,r,P/2,P);s.lineTo(x,y+r);s.absarc(x+r,y+r,r,P,1.5*P);
const g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelThickness:.012,bevelSize:.012,bevelSegments:2,curveSegments:8});
g.translate(0,0,-d/2);return g}
function mk(key,o={}){const m=new THREE.MeshStandardMaterial({color:C[key],roughness:.5,metalness:0,transparent:(o.op||1)<1,opacity:o.op||1});
m.userData.c=key;if(o.e!=null){m.emissive=new THREE.Color(C.teal);m.emissiveIntensity=o.e}mats.push(m);return m}
function box(p,w,h,r,d,key,x,y,z,o={}){const m=new THREE.Mesh(rg(w,h,r,d),mk(key,o));m.position.set(x,y,z);
m.castShadow=!o.noCast;m.receiveShadow=true;p.add(m);return m}
function label(p,text,w,h,key,x,y,z,align){const c=document.createElement('canvas');c.width=w*500;c.height=h*500;
const cx=c.getContext('2d'),t=new THREE.CanvasTexture(c);
const draw=()=>{cx.clearRect(0,0,c.width,c.height);cx.fillStyle=C[key];cx.font='700 '+c.height*.72+'px system-ui,sans-serif';
cx.textBaseline='middle';cx.textAlign=align;cx.fillText(text,align==='center'?c.width/2:6,c.height/2+2);t.needsUpdate=true};
draw();labels.push(draw);const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent:true}));
m.position.set(x,y,z);p.add(m)}

// back glass
box(rootG,6.6,4.2,.3,.06,'tint',0,-.05,-.5,{op:.5,noCast:1});

// stages
const NAMES=['Discover','Scope','Build','Launch'],XS=[-2.325,-.775,.775,2.325],YS=[-.5,-.15,.2,.55],ZE=[.6,.9,1.2,1.5];
const layers=[],stages=[];
NAMES.forEach((n,i)=>{const g=new THREE.Group();g.position.set(XS[i],YS[i],.1);rootG.add(g);
box(g,1.1,1.7,.16,.1,'surf',0,0,0);
const circ=box(g,.34,.34,.17,.04,'soft',-.3,.6,.07,{e:0});
label(g,String(i+1),.34,.34,'white',-.3,.6,.095,'center');
label(g,n,.62,.2,'ink',.14,.62,.075,'left');
box(g,.45,.06,.03,.03,'soft',.05,.42,.07);
const sq=[0,1,2].map(j=>{const y=.12-.3*j;box(g,[.5,.38,.44][j],.07,.03,.03,'soft',.08,y,.07);return box(g,.15,.15,.04,.03,'soft',-.33,y,.07)});
const pill=box(g,.82,.14,.07,.03,'tint',0,-.68,.07);
const bd=new THREE.Group();bd.position.set(.5,.78,.1);g.add(bd);
box(bd,.3,.3,.15,.04,'teal',0,0,0,{e:.2});label(bd,'\u2713',.3,.3,'white',0,0,.03,'center');
layers.push({g,y:YS[i],za:.1,ze:ZE[i],i});stages.push({g,circ,sq,pill,bd})});

// progress track + fill
const tk=new THREE.Group();tk.position.set(0,-1.8,.1);rootG.add(tk);
box(tk,5.6,.2,.1,.05,'tint',0,0,0);
const fill=box(tk,5.6,.2,.1,.05,'teal',0,0,.03,{e:.3});fill.geometry.translate(2.8,0,0);fill.position.x=-2.8;
layers.push({g:tk,y:-1.8,za:.1,ze:.45,i:4});

// connectors + pulses
const V=THREE.Vector3,curves=[],pulses=[];
for(let i=0;i<3;i++){const a=new V(XS[i]+.55,YS[i],-.1),b=new V(XS[i+1]-.55,YS[i+1],-.1);
const cu=new THREE.CubicBezierCurve3(a,a.clone().add(new V(.25,0,0)),b.clone().add(new V(-.25,0,0)),b);curves.push(cu);
const t=new THREE.Mesh(new THREE.TubeGeometry(cu,32,.03,8),mk('soft'));t.receiveShadow=true;rootG.add(t);
const s=new THREE.Mesh(new THREE.SphereGeometry(.075,16,12),mk('teal',{e:.9}));s.visible=false;rootG.add(s);pulses.push(s)}

// timeline
const ARR=[.4,1.7,3,4.3],SEG=[.8,2.1,3.4],DUR=.9,LOOP=7;
const ss=x=>x*x*(3-2*x),sk=(m,k)=>{if(m.userData.c!==k){m.userData.c=k;m.color.set(C[k])}};
let runStart=performance.now(),mx=0,my=0;
const kEl=document.getElementById('k');
function frame(now){
 const tr=reduce?99:(now-runStart)/1000;
 if(tr>LOOP&&!reduce){runStart=now;return frame(now)}
 const k=reduce?.3:+kEl.value;
 rootG.rotation.y+=((reduce?-.28:-.28+mx*.28)-rootG.rotation.y)*.08;
 rootG.rotation.x+=((reduce?-.1:-.1+my*.16)-rootG.rotation.x)*.08;
 layers.forEach(L=>{L.g.position.z=L.za+(L.ze-L.za)*k;L.g.position.y=L.y+(reduce?0:Math.sin(now/900+L.i*.9)*.025*k)});
 let n=0,s=0;
 stages.forEach((st,i)=>{const dt=tr-ARR[i],done=dt>=0;if(done)n++;
  const pop=dt>=0&&dt<=.45?1+.1*(1-dt/.45):1;st.g.scale.setScalar(pop);
  const kk=done?'teal':'soft';sk(st.circ.material,kk);st.sq.forEach(q=>sk(q.material,kk));sk(st.pill.material,done?'teal':'tint');
  st.bd.scale.setScalar(done?Math.max(.001,ss(Math.min(1,dt/.35))):.001);
  if(i===3)st.circ.material.emissiveIntensity=dt>=0&&dt<=.8?.7*(1-dt/.8):0});
 pulses.forEach((p,j)=>{const q=(tr-SEG[j])/DUR,on=q>=0&&q<=1;p.visible=on;if(on){p.position.copy(curves[j].getPoint(ss(q)));s=ss(q)}});
 fill.scale.x=Math.max(.001,Math.min(1,(n+s)/4));
 R.render(scene,cam)}
function applyTheme(){C=isDark()?DK:LT;mats.forEach(m=>{m.color.set(C[m.userData.c]);if(m.emissive)m.emissive.set(C.teal)});
 pl.color.set(C.teal);labels.forEach(d=>d());if(reduce||!raf)frame(performance.now())}
function resize(){const w=panel.clientWidth,h=panel.clientHeight;R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(w,h,false)}
let raf=0,last=0,seen=false;
function loop(now){raf=requestAnimationFrame(loop);if(now-last<33)return;last=now;frame(now)}
function setVis(v){if(reduce){frame(performance.now());return}
 if(v&&!raf){if(!seen){seen=true;runStart=performance.now()}raf=requestAnimationFrame(loop)}
 else if(!v&&raf){cancelAnimationFrame(raf);raf=0}}
new IntersectionObserver(e=>setVis(e[0].isIntersecting)).observe(panel);
new ResizeObserver(()=>{resize();frame(performance.now())}).observe(panel);
addEventListener('pointermove',e=>{mx=(e.clientX/innerWidth-.5)*2;my=(e.clientY/innerHeight-.5)*2},{passive:true});
document.getElementById('replay').onclick=()=>{runStart=performance.now();if(reduce)frame(0)};
kEl.oninput=()=>{if(reduce||!raf)frame(performance.now())};
document.getElementById('theme').onclick=()=>{root.dataset.theme=isDark()?'light':'dark';applyTheme()};
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);
applyTheme();resize();frame(performance.now());
</script></body></html>
